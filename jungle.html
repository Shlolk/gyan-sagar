<!DOCTYPE html>

<body style="margin:0;background:#0a0a1a;overflow:hidden;width:100%;height:100%">
    <!-- JUNGLE VIDEO BACKGROUND -->

        <source src="jungle-background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <a href="quiz-adventure.html" class="explore-btn" title="Explore the Quiz Map">Explore 🌟</a>

   

    <!-- QUIZ MODAL SCREEN - FULL SCREEN FOR JUNGLE -->
    <div class="quiz-modal full-screen-quiz" id="quizModal">
        <div class="quiz-container">
            <!-- Quiz Screen -->
            <div class="quiz-screen" id="quizScreen">
                <!-- Header -->
                <div class="quiz-header">
                    <a href="index.html" class="btn-close" title="Back to Home"><i class="fas fa-times"></i></a>
                    <div class="quiz-title" id="quizTitle">🌿 Jungle Adventure</div>
                    <div class="quiz-stats">
                        <span class="score-display">Score: <span id="scoreDisplay">0</span>/<span id="scoreTotal">10</span></span>
                        <span class="score-display" style="margin-left:12px;">Time: <span id="timerDisplay">30</span>s</span>
                        <span class="score-display" style="margin-left:12px;">Lives: <span id="livesDisplay">❤️❤️❤️</span></span>
                    </div>
                    <button id="startQuizBtn" class="btn btn-primary" style="margin-left:12px;">Start Quiz</button>
                    <button id="restartAdventureBtn" class="btn btn-secondary" style="margin-left:8px;">Restart Fresh</button>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="question-counter" id="questionCounter">Question 1 of 10</div>

                <!-- Question -->
                <div class="question-box" id="questionBox">
                    <h3 id="questionText">Question text here</h3>
                </div>

                <!-- Options -->
                <div class="options-container" id="optionsContainer"></div>

                <!-- Feedback -->
                <div class="feedback-box hidden" id="feedbackBox">
                    <div class="feedback-content" id="feedbackContent"></div>
                </div>

                <!-- Next Button -->
                <button class="btn btn-primary btn-next hidden" id="nextBtn">
                    Next Question <i class="fas fa-arrow-right"></i>
                </button>
            </div>

            <!-- Results Screen -->
            <div class="results-screen hidden" id="resultsScreen">
                <div class="results-content">
                    <div class="results-emoji" id="resultsEmoji">🎉</div>
                    <h2 class="results-title" id="resultsTitle">Awesome Job!</h2>
                    <div class="final-score" id="finalScore">You got 0 out of 10 correct!</div>
                    <div class="results-message" id="resultsMessage">You're a quiz champion! 🏆</div>
                    
                    <div class="results-buttons">
                        <button class="btn btn-primary" id="playAgainBtn">
                            <i class="fas fa-redo"></i> Play Again
                        </button>
                        <button class="btn btn-secondary" id="restartAdventureResultsBtn">
                            <i class="fas fa-rotate-left"></i> Restart Fresh
                        </button>
                        <button class="btn btn-secondary" id="backToWorldsBtn">
                            <i class="fas fa-arrow-left"></i> Back to Worlds
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti Container -->
    <div id="confetti-container"></div>

        function getLevelFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const rawLevel = parseInt(params.get('level') || '1', 10);
            if (Number.isNaN(rawLevel)) return 1;
            // Allow normal levels 1..7 and boss 99
            if (rawLevel === 99) return 99;
            return Math.min(7, Math.max(1, rawLevel));
        }

        function getQuizForLevel(level) {
            return JUNGLE_LEVELS[level] || JUNGLE_LEVELS[1];
        }

        function restartJungleAdventureFresh() {
            const ok = confirm("Restart Jungle Adventure from the beginning? This will reset your jungle progress.");
            if (!ok) return;

            clearQuestionTimer();
            try {
                localStorage.removeItem('cleared_jungle');
            } catch (e) { }

            window.location.href = 'quiz-adventure.html?world=jungle';
        }

        // Auto-initialize jungle quiz when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Check URL params to decide if the quiz should start immediately
            const params = new URLSearchParams(window.location.search);
            const startParam = params.get('start');
            const level = getLevelFromUrl();

            window.requestedLevel = level;
            window.currentQuiz = getQuizForLevel(level);
            window.currentQuestionIndex = 0;
            window.score = 0;
            livesRemaining = 3;
            window.quizActive = true;
            window.answered = false;

            const quizContainer = document.querySelector(".quiz-container");
            if (quizContainer) quizContainer.className = "quiz-container theme-jungle";

            const quizTitle = document.getElementById("quizTitle");
            if (quizTitle) quizTitle.textContent = window.currentQuiz.title;

            const scoreDisplay = document.getElementById("scoreDisplay");
            if (scoreDisplay) scoreDisplay.textContent = "0";

            const scoreTotal = document.getElementById("scoreTotal");
            if (scoreTotal) scoreTotal.textContent = String(window.currentQuiz.questions.length);

            updateLivesDisplay();

            document.getElementById("questionCounter").textContent = `Question 1 of ${window.currentQuiz.questions.length}`;

            // Load first question only when explicitly requested via start=true
            if (startParam === 'true') {
                loadQuestionJungle();
            }

                // Hook up manual start button so users visiting jungle.html directly can start the quiz
                const startBtn = document.getElementById('startQuizBtn');
                if (startBtn) {
                    startBtn.addEventListener('click', function () {
                        // Reset quiz state and start
                        window.currentQuestionIndex = 0;
                        window.score = 0;
                        window.quizActive = true;
                        window.answered = false;
                        document.getElementById('scoreDisplay').textContent = '0';
                        document.getElementById('quizScreen').classList.remove('hidden');
                        document.getElementById('resultsScreen').classList.add('hidden');
                        loadQuestionJungle();
                    });
                }

                const restartBtn = document.getElementById('restartAdventureBtn');
                if (restartBtn) {
                    restartBtn.addEventListener('click', restartJungleAdventureFresh);
                }

                const restartResultBtn = document.getElementById('restartAdventureResultsBtn');
                if (restartResultBtn) {
                    restartResultBtn.addEventListener('click', restartJungleAdventureFresh);
                }
        });

        function loadQuestionJungle() {
            clearQuestionTimer();
            if (window.currentQuestionIndex >= window.currentQuiz.questions.length) {
                showResultsJungle();
                return;
            }

            const question = window.currentQuiz.questions[window.currentQuestionIndex];
            window.answered = false;
            questionTimeLeft = 30;

            document.getElementById("questionCounter").textContent = `Question ${window.currentQuestionIndex + 1} of ${window.currentQuiz.questions.length}`;
            updateProgressBar();
            updateTimerDisplay();
            startQuestionTimer();

            document.getElementById("questionText").textContent = question.question;

            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            question.options.forEach((option, index) => {
                const optionBtn = document.createElement("button");
                optionBtn.className = "option-btn";
                optionBtn.textContent = option;
                optionBtn.addEventListener("click", () => checkAnswerJungle(option, question.correct, question.explanation));
                container.appendChild(optionBtn);
            });

            document.getElementById("feedbackBox").classList.add("hidden");
            document.getElementById("nextBtn").classList.add("hidden");
        }

        function updateTimerDisplay() {
            const timerDisplay = document.getElementById("timerDisplay");
            if (timerDisplay) timerDisplay.textContent = String(questionTimeLeft);
        }

        function updateLivesDisplay() {
            const livesDisplay = document.getElementById("livesDisplay");
            if (!livesDisplay) return;

            livesDisplay.textContent = "❤️".repeat(Math.max(0, livesRemaining)) + "🖤".repeat(Math.max(0, 3 - livesRemaining));
        }

        function loseLifeAndMaybeEndQuiz() {
            livesRemaining = Math.max(0, livesRemaining - 1);
            updateLivesDisplay();

            if (livesRemaining <= 0) {
                clearQuestionTimer();
                window.currentQuestionIndex = window.currentQuiz.questions.length;
                setTimeout(() => showResultsJungle(), 700);
                return true;
            }

            return false;
        }

        function clearQuestionTimer() {
            if (questionTimer) {
                clearInterval(questionTimer);
                questionTimer = null;
            }
        }

        function startQuestionTimer() {
            clearQuestionTimer();
            questionTimer = setInterval(() => {
                if (window.answered) {
                    clearQuestionTimer();
                    return;
                }

                questionTimeLeft -= 1;
                updateTimerDisplay();

                if (questionTimeLeft <= 0) {
                    clearQuestionTimer();
                    handleQuestionTimeout();
                }
            }, 1000);
        }

        function handleQuestionTimeout() {
            if (window.answered) return;

            window.answered = true;
            const ended = loseLifeAndMaybeEndQuiz();
            playWrongSound();

            const question = window.currentQuiz.questions[window.currentQuestionIndex];
            showTimeoutFeedback(question.correct, question.explanation);

            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => {
                if (btn.textContent === question.correct) {
                    btn.classList.add("correct");
                }
                btn.disabled = true;
            });

            document.getElementById("feedbackBox").classList.remove("hidden");

            if (!ended) {
                setTimeout(() => {
                    document.getElementById("nextBtn").classList.remove("hidden");
                }, 500);
            }
        }

        function updateProgressBar() {
            const totalQuestions = window.currentQuiz.questions.length;
            const progress = ((window.currentQuestionIndex + 1) / totalQuestions) * 100;
            document.getElementById("progressBar").style.width = progress + "%";
        }

        function checkAnswerJungle(selected, correct, explanation) {
            if (window.answered) return;

            window.answered = true;
            clearQuestionTimer();
            const isCorrect = selected === correct;

            if (isCorrect) {
                window.score++;
                playCorrectSound();
                showCorrectFeedback(explanation);
            } else {
                loseLifeAndMaybeEndQuiz();
                playWrongSound();
                showIncorrectFeedback(selected, correct, explanation);
            }

            document.getElementById("scoreDisplay").textContent = window.score;

            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => {
                if (btn.textContent === correct) {
                    btn.classList.add("correct");
                } else if (btn.textContent === selected && !isCorrect) {
                    btn.classList.add("incorrect");
                }
                btn.disabled = true;
            });

            document.getElementById("feedbackBox").classList.remove("hidden");

            if (livesRemaining > 0 || isCorrect) {
                setTimeout(() => {
                    document.getElementById("nextBtn").classList.remove("hidden");
                }, 500);
            }
        }

        function showCorrectFeedback(explanation) {
            const feedbackBox = document.getElementById("feedbackBox");
            const content = document.getElementById("feedbackContent");

            if (feedbackCloseTimer) {
                clearTimeout(feedbackCloseTimer);
                feedbackCloseTimer = null;
            }

            feedbackBox.className = "feedback-box feedback-correct feedback-jungle-popup";
            content.innerHTML = `
                <div class="feedback-popup-image-wrap">
                    <img class="feedback-popup-image" src="popup.png" alt="Happy jungle monkey celebrating a correct answer">
                </div>
            `;

            feedbackCloseTimer = setTimeout(() => {
                feedbackBox.classList.add("hidden");
                feedbackCloseTimer = null;
            }, 1800);
        }

        function showIncorrectFeedback(selected, correct, explanation) {
            const feedbackBox = document.getElementById("feedbackBox");
            const content = document.getElementById("feedbackContent");

            if (feedbackCloseTimer) {
                clearTimeout(feedbackCloseTimer);
                feedbackCloseTimer = null;
            }

            feedbackBox.className = "feedback-box feedback-incorrect feedback-jungle-wrong";
            content.innerHTML = `
                <div class="feedback-popup-image-wrap">
                    <img class="feedback-popup-image" src="worng-pop.png" alt="Sad jungle monkey showing a wrong answer">
                </div>
                <div class="feedback-title">Oops, try again!</div>
                <div class="feedback-text">The correct answer is: <strong>${correct}</strong></div>
                <div class="feedback-text">${explanation}</div>
            `;
        }

        function showTimeoutFeedback(correct, explanation) {
            const feedbackBox = document.getElementById("feedbackBox");
            const content = document.getElementById("feedbackContent");

            if (feedbackCloseTimer) {
                clearTimeout(feedbackCloseTimer);
                feedbackCloseTimer = null;
            }

            feedbackBox.className = "feedback-box feedback-incorrect feedback-jungle-wrong";
            content.innerHTML = `
                <div class="feedback-popup-image-wrap">
                    <img class="feedback-popup-image" src="worng-pop.png" alt="Jungle timer ran out">
                </div>
                <div class="feedback-title">Time's up!</div>
                <div class="feedback-text">The correct answer is: <strong>${correct}</strong></div>
                <div class="feedback-text">${explanation}</div>
            `;
        }

        function playCorrectSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = "sine";

            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        function playWrongSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.linearRampToValueAtTime(200, audioContext.currentTime + 0.3);
            oscillator.type = "sine";

            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        document.getElementById("nextBtn").addEventListener("click", function() {
            window.currentQuestionIndex++;
            loadQuestionJungle();
        });

        document.getElementById("playAgainBtn").addEventListener("click", function() {
            clearQuestionTimer();
            window.currentQuestionIndex = 0;
            window.score = 0;
            window.answered = false;
            questionTimeLeft = 30;
            livesRemaining = 3;
            document.getElementById("scoreDisplay").textContent = "0";
            document.getElementById("scoreTotal").textContent = String(window.currentQuiz.questions.length);
            updateTimerDisplay();
            updateLivesDisplay();
            document.getElementById("quizScreen").classList.remove("hidden");
            document.getElementById("resultsScreen").classList.add("hidden");
            document.getElementById("quizTitle").textContent = window.currentQuiz.title;
            loadQuestionJungle();
        });

        document.getElementById("backToWorldsBtn").addEventListener("click", function() {
            window.location.href = "index.html";
        });

        function showResultsJungle() {
            window.quizActive = false;
            clearQuestionTimer();

            document.getElementById("quizScreen").classList.add("hidden");
            document.getElementById("resultsScreen").classList.remove("hidden");

            const totalQuestions = window.currentQuiz.questions.length;
            const percentage = (window.score / totalQuestions) * 100;
            let emoji = "🎉";
            let title = "Awesome Job!";
            let message = "";

            if (window.score === totalQuestions) {
                emoji = "🏆";
                title = "PERFECT SCORE! 🌟";
                message = "You're a quiz champion! You got every single one right! You're incredible!";
                createConfetti();
            } else if (window.score >= Math.ceil(totalQuestions * 0.8)) {
                emoji = "🌟";
                title = "Excellent Work!";
                message = `You got ${window.score} out of ${totalQuestions}! That's amazing! Keep practicing!`;
            } else if (window.score >= Math.ceil(totalQuestions * 0.6)) {
                emoji = "😊";
                title = "Great Job!";
                message = `You got ${window.score} out of ${totalQuestions}! Good effort! Play again to improve!`;
            } else if (window.score >= Math.ceil(totalQuestions * 0.4)) {
                emoji = "💪";
                title = "Good Try!";
                message = `You got ${window.score} out of ${totalQuestions}. Keep learning and try again!`;
            } else {
                emoji = "📚";
                title = "Learning Adventure!";
                message = "You're just getting started! Try again to improve!";
            }

            document.getElementById("resultsEmoji").textContent = emoji;
            document.getElementById("resultsTitle").textContent = title;
            document.getElementById("finalScore").textContent = `You got ${window.score} out of ${totalQuestions} correct!`;
            document.getElementById("resultsMessage").textContent = message;

            // If the player came from a map level (requestedLevel), and passed,
            // mark the level cleared in localStorage and return to the map.
            const passThreshold = Math.ceil(totalQuestions * 0.7); // score needed to clear a normal level
            const lvl = window.requestedLevel ? parseInt(window.requestedLevel, 10) : null;
            if (lvl) {
                if (lvl === 99) {
                    // Final boss requires a perfect score to win
                    if (window.score === totalQuestions) {
                        // Winner
                        try {
                            const key = 'cleared_jungle';
                            const cur = parseInt(localStorage.getItem(key) || '0', 10) || 0;
                            if (99 > cur) localStorage.setItem(key, String(99));
                        } catch (e) { }

                        document.getElementById("resultsEmoji").textContent = "🏅";
                        document.getElementById("resultsTitle").textContent = "CHAMPION!";
                        document.getElementById("resultsMessage").textContent = "You defeated the Final Boss and won the game! 🎉";
                        createConfetti();
                    } else {
                        // Not perfect: did not beat boss
                        document.getElementById("resultsEmoji").textContent = "😅";
                        document.getElementById("resultsTitle").textContent = "Almost There";
                        document.getElementById("resultsMessage").textContent = "You need to get all questions correct to beat the Final Boss. Try again!";
                    }

                    // Return to map in either case so they can retry or celebrate
                    setTimeout(() => {
                        window.location.href = 'quiz-adventure.html?world=jungle';
                    }, 2000);
                } else {
                    // Normal level clearing
                    if (window.score >= passThreshold) {
                        try {
                            const key = 'cleared_jungle';
                            const cur = parseInt(localStorage.getItem(key) || '0', 10) || 0;
                            if (lvl > cur) localStorage.setItem(key, String(lvl));
                        } catch (e) { /* ignore storage errors */ }

                        // Return to map so user can proceed to next unlocked level
                        setTimeout(() => {
                            window.location.href = 'quiz-adventure.html?world=jungle';
                        }, 1400);
                    }
                }
            }
        }

        function createConfetti() {
            const container = document.getElementById("confetti-container");
            container.innerHTML = "";

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.textContent = ["🎉", "⭐", "🎊", "🏆", "🌟"][Math.floor(Math.random() * 5)];
                confetti.style.left = Math.random() * 100 + "%";
                confetti.style.animationDelay = Math.random() * 0.5 + "s";

                container.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3000);
            }
        }
    </script>
